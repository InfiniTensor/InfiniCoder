name: Core checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  core:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . ruff build
      - if: matrix.python == '3.12'
        run: python -m pip install -e '.[text]'
      - run: ruff check src tests examples
      - run: python -m unittest discover -s tests -q
      - run: infinicoder --version
      - run: python -m build

  namespace:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      IC_REQUIRE_BWRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install namespace test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          python -m pip install -e .
      - name: Require real namespace execution
        run: python -m unittest discover -s tests -p test_collaboration_namespace.py -v
